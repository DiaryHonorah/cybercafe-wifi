<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================ -->
    <!-- FAVICONS (affichés dans la barre d'adresse) -->
    <!-- ============================================ -->

    <!-- Favicon principal (affiché dans l'onglet et la barre d'adresse) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Fallback pour anciens navigateurs (format .ico) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- ============================================ -->
    <!-- PWA / MOBILE -->
    <!-- ============================================ -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F97316" />

    <!-- ============================================ -->
    <!-- APPLE (iOS) -->
    <!-- ============================================ -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cyber Famille" />

    <!-- ============================================ -->
    <!-- SEO / META -->
    <!-- ============================================ -->
    <meta
      name="description"
      content="Application de gestion de cybercafé Cyber Famille — Vente de tickets Wi-Fi, statistiques, sessions en direct"
    />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Cyber Famille — Gestion Wi-Fi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
